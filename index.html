<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Resim Galerisi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Resim Galerisi</h1>

    <div class="gallery">

        <!-- BÜYÜK KART -->
        <div class="card card-large">
            <img class="card-img" src="https://picsum.photos/600/400" alt="Doğa manzarası">
            <div class="card-content">
                <h3 class="card-title">Doğa</h3>
                <p class="card-text">Harika bir doğa manzarası.</p>
            </div>
        </div>

        <!-- NORMAL KARTLAR -->
        <div class="card">
            <img class="card-img" src="https://picsum.photos/300/200" alt="Şehir görünümü">
            <div class="card-content">
                <h3 class="card-title">Şehir</h3>
                <p class="card-text">Modern şehir hayatı.</p>
            </div>
        </div>

        <div class="card">
            <img class="card-img" src="https://picsum.photos/301/200" alt="Deniz manzarası">
            <div class="card-content">
                <h3 class="card-title">Deniz</h3>
                <p class="card-text">Sakin deniz görüntüsü.</p>
            </div>
        </div>

        <div class="card">
            <img class="card-img" src="https://picsum.photos/302/200" alt="Dağ manzarası">
            <div class="card-content">
                <h3 class="card-title">Dağ</h3>
                <p class="card-text">Yüksek dağlar.</p>
            </div>
        </div>

        <div class="card">
            <img class="card-img" src="https://picsum.photos/303/200" alt="Orman manzarası">
            <div class="card-content">
                <h3 class="card-title">Orman</h3>
                <p class="card-text">Yeşil doğa.</p>
            </div>
        </div>

        <div class="card">
            <img class="card-img" src="https://picsum.photos/304/200" alt="Göl manzarası">
            <div class="card-content">
                <h3 class="card-title">Göl</h3>
                <p class="card-text">Sessiz göl.</p>
            </div>
        </div>

    </div>

</body>
</html>
